<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مدیریت Nova Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Tahoma, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f6fa;
      color: #222;
    }

    .container {
      width: min(100% - 30px, 900px);
      margin: 40px auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      padding: 11px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin: 4px;
    }

    .login-btn,
    .add-btn {
      background: #111827;
      color: white;
      width: 100%;
    }

    .edit-btn {
      background: #2563eb;
      color: white;
    }

    .delete-btn {
      background: #dc2626;
      color: white;
    }

    .cancel-btn {
      background: #e5e7eb;
      color: #111;
    }

    .product {
      border: 1px solid #eee;
      padding: 18px;
      border-radius: 15px;
      margin-top: 12px;
      background: #fafafa;
    }

    .product img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .price {
      font-weight: bold;
      color: #16a34a;
    }

    .status {
      white-space: pre-line;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
    }

    .hidden {
      display: none;
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
      font-size: 13px;
    }

    .checkbox-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 10px 0;
    }

    .checkbox-row input {
      width: auto;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div class="box" id="loginBox">
    <h1>🔐 ورود به مدیریت</h1>

    <input
      type="email"
      id="email"
      placeholder="ایمیل"
    >

    <input
      type="password"
      id="password"
      placeholder="رمز عبور"
    >

    <button class="login-btn" id="loginButton">
      ورود
    </button>

    <div id="loginStatus" class="status"></div>
  </div>


  <!-- ADMIN PANEL -->
  <div class="hidden" id="adminPanel">

    <div class="box">
      <h1>🛍️ مدیریت Nova Store</h1>
      <p>از اینجا محصولات فروشگاه را مدیریت کن.</p>
    </div>


    <!-- ADD / EDIT -->
    <div class="box">

      <h2 id="formTitle">➕ افزودن محصول</h2>

      <input type="hidden" id="editId">

      <label>نام محصول</label>
      <input id="name" placeholder="مثلاً هدفون بی‌سیم">

      <label>دسته‌بندی</label>
      <input id="category" placeholder="مثلاً لوازم دیجیتال">

      <label>توضیحات</label>
      <textarea
        id="description"
        placeholder="توضیحات محصول"
      ></textarea>

      <label>قیمت</label>
      <input
        id="price"
        type="number"
        placeholder="مثلاً 1990000"
      >

      <label>قیمت قبلی</label>
      <input
        id="old_price"
        type="number"
        placeholder="اختیاری"
      >

      <label>تصویر محصول</label>

<input
  type="file"
  id="imageFile"
  accept="image/*"
>

<input
  type="hidden"
  id="image"
>

<p id="imageStatus"></p>

      <label>متن تخفیف</label>
      <input
        id="discount"
        placeholder="مثلاً 20٪ تخفیف"
      >

      <div class="checkbox-row">
        <input type="checkbox" id="is_new">
        <label for="is_new">محصول جدید است</label>
      </div>

      <button class="add-btn" id="saveButton">
        ➕ افزودن محصول
      </button>

      <button
        class="cancel-btn hidden"
        id="cancelEditButton"
      >
        لغو ویرایش
      </button>

      <div id="formStatus" class="status"></div>

    </div>


    <!-- PRODUCTS -->
    <div class="box">

      <h2>📦 محصولات</h2>

      <div id="productsList">
        در حال دریافت محصولات...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://zwtbrgsphgjyczdibldj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_rU0rSsuonmSoDYzK9-S1ig_uNPkAOha";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// =========================
// عناصر صفحه
// =========================

const loginBox =
document.getElementById("loginBox");

const adminPanel =
document.getElementById("adminPanel");

const loginButton =
document.getElementById("loginButton");

const loginStatus =
document.getElementById("loginStatus");

const saveButton =
document.getElementById("saveButton");

const cancelEditButton =
document.getElementById("cancelEditButton");

const productsList =
document.getElementById("productsList");


// =========================
// وضعیت
// =========================

function showLoginStatus(message) {
  loginStatus.textContent = message;
}

function showFormStatus(message) {
  document.getElementById("formStatus").textContent = message;
}


// =========================
// ورود
// =========================

loginButton.addEventListener("click", async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showLoginStatus("❌ ایمیل و رمز عبور را وارد کن.");
    return;
  }

  loginButton.disabled = true;
  loginButton.textContent = "در حال ورود...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    loginButton.disabled = false;
    loginButton.textContent = "ورود";

    showLoginStatus(
      "❌ ورود ناموفق بود:\n" +
      error.message
    );

    return;
  }

  if (!data || !data.user) {

    loginButton.disabled = false;
    loginButton.textContent = "ورود";

    showLoginStatus("❌ ورود انجام نشد.");

    return;
  }

  showLoginStatus("✅ ورود موفق بود.");

  loginBox.style.display = "none";
  adminPanel.classList.remove("hidden");

  await loadProducts();

});


// =========================
// دریافت محصولات
// =========================

async function loadProducts() {

  productsList.textContent =
    "در حال دریافت محصولات...";

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id", {
        ascending: false
      });

  if (error) {

    productsList.textContent =
      "❌ خطا در دریافت محصولات:\n" +
      error.message;

    return;
  }

  if (!data || data.length === 0) {

    productsList.textContent =
      "هنوز محصولی ثبت نشده است.";

    return;
  }

  productsList.innerHTML = "";

  data.forEach(function(product) {

    const div =
      document.createElement("div");

    div.className = "product";

    let imageHTML = "";

    if (product.image) {

      imageHTML = `
        <img
          src="${escapeHTML(product.image)}"
          alt="${escapeHTML(product.name || "")}"
        >
      `;

    }

    div.innerHTML = `

      ${imageHTML}

      <h3>
        ${escapeHTML(product.name || "بدون نام")}
      </h3>

      <p>
        دسته‌بندی:
        ${escapeHTML(product.category || "-")}
      </p>

      <p>
        ${escapeHTML(product.description || "")}
      </p>

      <p class="price">
        قیمت:
        ${formatPrice(product.price)}
        تومان
      </p>

      ${
        product.old_price
        ? `<p>
            قیمت قبلی:
            ${formatPrice(product.old_price)}
            تومان
           </p>`
        : ""
      }

      ${
        product.discount
        ? `<p>
            🏷️ ${escapeHTML(product.discount)}
           </p>`
        : ""
      }

      ${
        product.is_new
        ? `<p>🆕 محصول جدید</p>`
        : ""
      }

      <div>

        <button
          class="edit-btn"
          onclick="editProduct(${product.id})"
        >
          ✏️ ویرایش
        </button>

        <button
          class="delete-btn"
          onclick="deleteProduct(${product.id})"
        >
          🗑️ حذف محصول
        </button>

      </div>

    `;

    productsList.appendChild(div);

  });

}


// =========================
// افزودن / ویرایش
// =========================

saveButton.addEventListener("click", async function() {

  const editId =
    document.getElementById("editId").value;
const file = document.getElementById("imageFile").files[0];

let imageUrl =
  document.getElementById("image").value.trim();

if (file) {

  const extension =
    file.name.includes(".")
      ? file.name.split(".").pop().toLowerCase()
      : "jpg";

  const fileName =
    `${Date.now()}-${Math.random().toString(36).slice(2)}.${extension}`;

  const { error: uploadError } =
    await supabaseClient.storage
      .from("products")
      .upload(fileName, file);

  if (uploadError) {

    showFormStatus(
      "❌ خطا در آپلود عکس:\n" +
      uploadError.message
    );

    return;
  }

  const { data: publicUrlData } =
    supabaseClient.storage
      .from("products")
      .getPublicUrl(fileName);

  imageUrl = publicUrlData.publicUrl;
}
  const product = {

    name:
      document.getElementById("name").value.trim(),

    category:
      document.getElementById("category").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    price:
      document.getElementById("price").value
        ? Number(document.getElementById("price").value)
        : null,

    old_price:
      document.getElementById("old_price").value
        ? Number(document.getElementById("old_price").value)
        : null,

    image:
      document.getElementById("image").value.trim(),

    discount:
      document.getElementById("discount").value.trim(),

    is_new:
      document.getElementById("is_new").checked

  };


  if (!product.name) {

    showFormStatus(
      "❌ نام محصول را وارد کن."
    );

    return;
  }


  saveButton.disabled = true;
  saveButton.textContent =
    editId
      ? "در حال ذخیره تغییرات..."
      : "در حال افزودن...";


  // ویرایش
  if (editId) {

    const { error } =
      await supabaseClient
        .from("products")
        .update(product)
        .eq("id", editId);

    if (error) {

      showFormStatus(
        "❌ خطا در ویرایش:\n" +
        error.message
      );

    } else {

      showFormStatus(
        "✅ محصول با موفقیت ویرایش شد."
      );

      resetForm();

      await loadProducts();

    }

  }

  // افزودن
  else {

    const { error } =
      await supabaseClient
        .from("products")
        .insert([product]);

    if (error) {

      showFormStatus(
        "❌ خطا در افزودن:\n" +
        error.message
      );

    } else {

      showFormStatus(
        "✅ محصول جدید اضافه شد."
      );

      resetForm();

      await loadProducts();

    }

  }


  saveButton.disabled = false;

});


// =========================
// شروع ویرایش
// =========================

async function editProduct(id) {

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("id", id)
      .single();

  if (error) {

    showFormStatus(
      "❌ خطا در دریافت محصول:\n" +
      error.message
    );

    return;
  }


  document.getElementById("editId").value =
    data.id;

  document.getElementById("name").value =
    data.name || "";

  document.getElementById("category").value =
    data.category || "";

  document.getElementById("description").value =
    data.description || "";

  document.getElementById("price").value =
    data.price ?? "";

  document.getElementById("old_price").value =
    data.old_price ?? "";

  document.getElementById("image").value =
    data.image || "";

  document.getElementById("discount").value =
    data.discount || "";

  document.getElementById("is_new").checked =
    data.is_new === true;


  document.getElementById("formTitle").textContent =
    "✏️ ویرایش محصول";

  saveButton.textContent =
    "💾 ذخیره تغییرات";

  cancelEditButton.classList.remove("hidden");


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


// =========================
// لغو ویرایش
// =========================

cancelEditButton.addEventListener(
  "click",
  function() {

    resetForm();

  }
);


function resetForm() {

  document.getElementById("editId").value = "";

  document.getElementById("name").value = "";
  document.getElementById("category").value = "";
  document.getElementById("description").value = "";
  document.getElementById("price").value = "";
  document.getElementById("old_price").value = "";
  document.getElementById("image").value = "";
  document.getElementById("discount").value = "";
  document.getElementById("is_new").checked = false;

  document.getElementById("formTitle").textContent =
    "➕ افزودن محصول";

  saveButton.textContent =
    "➕ افزودن محصول";

  cancelEditButton.classList.add("hidden");

  showFormStatus("");

}


// =========================
// حذف محصول
// =========================

async function deleteProduct(id) {

  const confirmDelete =
    confirm("آیا مطمئنی می‌خواهی این محصول حذف شود؟");

  if (!confirmDelete) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    showFormStatus(
      "❌ خطا در حذف:\n" +
      error.message
    );

    return;
  }


  showFormStatus(
    "✅ محصول حذف شد."
  );

  await loadProducts();

}


// =========================
// فرمت قیمت
// =========================

function formatPrice(price) {

  if (
    price === null ||
    price === undefined ||
    price === ""
  ) {
    return "-";
  }

  return Number(price).toLocaleString("fa-IR");

}


// =========================
// جلوگیری از HTML خطرناک
// =========================

function escapeHTML(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
  </html>
