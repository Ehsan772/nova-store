<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مدیریت Nova Store</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f4f5;
  color: #111;
}

.box {
  width: 100%;
  max-width: 650px;
  margin: 30px auto;
  background: #fff;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  margin-bottom: 30px;
}

h2 {
  margin-top: 25px;
}

input,
textarea,
button {
  width: 100%;
  margin-top: 10px;
  padding: 13px;
  border-radius: 9px;
  border: 1px solid #ccc;
  font-size: 16px;
}

textarea {
  min-height: 100px;
  resize: vertical;
}

button {
  border: none;
  background: #111;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

#status {
  margin-top: 15px;
  padding: 10px;
  border-radius: 8px;
  text-align: center;
  display: none;
}

.product {
  margin-top: 15px;
  padding: 15px;
  background: #f5f5f5;
  border-radius: 12px;
}

.delete {
  background: #d32f2f;
}

label {
  display: block;
  margin-top: 15px;
}

#is_new {
  width: auto;
  margin-left: 5px;
}
</style>
</head>

<body>

<div class="box">

<h1>🛍️ مدیریت Nova Store</h1>


<!-- ==================== ورود ==================== -->

<div id="loginBox">

<h2>ورود مدیر</h2>

<input
  id="email"
  type="email"
  placeholder="ایمیل"
  autocomplete="email"
>

<input
  id="password"
  type="password"
  placeholder="رمز عبور"
  autocomplete="current-password"
>

<button id="loginButton" type="button">
ورود
</button>

<div id="status"></div>

</div>


<!-- ==================== پنل مدیریت ==================== -->

<div id="adminPanel" style="display:none;">

<h2>➕ افزودن محصول</h2>

<input
  id="name"
  type="text"
  placeholder="نام محصول"
>

<input
  id="category"
  type="text"
  placeholder="دسته‌بندی"
>

<textarea
  id="description"
  placeholder="توضیحات محصول"
></textarea>

<input
  id="price"
  type="number"
  placeholder="قیمت"
>

<input
  id="old_price"
  type="number"
  placeholder="قیمت قبلی"
>

<input
  id="image"
  type="text"
  placeholder="لینک عکس محصول"
>

<input
  id="discount"
  type="text"
  placeholder="تخفیف، مثلا 20٪"
>

<label>
<input
  id="is_new"
  type="checkbox"
>
محصول جدید
</label>

<button id="addButton" type="button">
افزودن محصول
</button>


<h2>📦 محصولات</h2>

<div id="products">
در حال دریافت محصولات...
</div>

</div>

</div>


<!-- ==================== Supabase ==================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zwtbrgsphgjyczdibldj.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_rU0rSsuonmSoDYzK9-S1ig_uNPkAOha";


const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// ==================== وضعیت ====================

function showStatus(message, success = false) {

  const status = document.getElementById("status");

  status.style.display = "block";
  status.textContent = message;

  status.style.background = success
    ? "#d9f7df"
    : "#ffe0e0";

  status.style.color = success
    ? "#146c2e"
    : "#a00000";
}


// ==================== ورود ====================

document
.getElementById("loginButton")
.addEventListener("click", async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!email || !password) {

    showStatus(
      "❌ ایمیل و رمز عبور را وارد کن."
    );

    return;
  }


  const button =
    document.getElementById("loginButton");

  button.disabled = true;
  button.textContent = "در حال ورود...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email: email,

      password: password

    });


  if (error) {

    button.disabled = false;
    button.textContent = "ورود";

    showStatus(
      "❌ ورود ناموفق بود: " +
      error.message
    );

    return;
  }


  if (!data || !data.user) {

    button.disabled = false;
    button.textContent = "ورود";

    showStatus(
      "❌ ورود انجام نشد."
    );

    return;
  }


  showStatus(
    "✅ ورود موفق بود.",
    true
  );


  document
    .getElementById("loginBox")
    .style.display = "none";


  document
    .getElementById("adminPanel")
    .style.display = "block";


  await loadProducts();

});


// ==================== افزودن محصول ====================

document
.getElementById("addButton")
.addEventListener("click", async function() {

  const product = {

    name:
      document.getElementById("name").value.trim(),

    category:
      document.getElementById("category").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    price:
      document.getElementById("price").value,

    old_price:
      document.getElementById("old_price").value || null,

    image:
      document.getElementById("image").value.trim(),

    discount:
      document.getElementById("discount").value.trim(),

    is_new:
      document.getElementById("is_new").checked

  };


  if (!product.name || !product.price) {

    alert(
      "❌ نام محصول و قیمت را وارد کن."
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .insert([product]);


  if (error) {

    alert(
      "❌ خطا در افزودن محصول:\n" +
      error.message
    );

    return;
  }


  alert("✅ محصول با موفقیت اضافه شد.");


  document.getElementById("name").value = "";
  document.getElementById("category").value = "";
  document.getElementById("description").value = "";
  document.getElementById("price").value = "";
  document.getElementById("old_price").value = "";
  document.getElementById("image").value = "";
  document.getElementById("discount").value = "";
  document.getElementById("is_new").checked = false;


  await loadProducts();

});


// ==================== دریافت محصولات ====================

async function loadProducts() {

  const container =
    document.getElementById("products");


  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id", {
        ascending: false
      });


  if (error) {

    container.innerHTML =
      "<p>❌ خطا در دریافت محصولات: " +
      error.message +
      "</p>";

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      "<p>هنوز محصولی اضافه نشده است.</p>";

    return;
  }


  container.innerHTML = "";


  data.forEach(function(product) {

    const div =
      document.createElement("div");

    div.className = "product";


    div.innerHTML = `

      <strong>${escapeHTML(product.name)}</strong>

      <p>
        دسته‌بندی:
        ${escapeHTML(product.category || "-")}
      </p>

      <p>
        قیمت:
        ${product.price || "-"}
      </p>

      <p>
        ${escapeHTML(product.description || "")}
      </p>

      <button
        class="delete"
        type="button"
        onclick="deleteProduct(${product.id})"
      >
        حذف محصول
      </button>

    `;


    container.appendChild(div);

  });

}


// ==================== حذف محصول ====================

async function deleteProduct(id) {

  const answer =
    confirm(
      "آیا از حذف این محصول مطمئنی؟"
    );


  if (!answer) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    alert(
      "❌ خطا در حذف محصول:\n" +
      error.message
    );

    return;
  }


  alert(
    "✅ محصول حذف شد."
  );


  await loadProducts();

}


// ==================== امنیت نمایش متن ====================

function escapeHTML(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>

</body>
  </html>
