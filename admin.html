<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مدیریت Nova Store</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  margin: 0;
  padding: 20px;
}

.box {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 15px #ddd;
}

h1 {
  text-align: center;
}

input, textarea, button {
  width: 100%;
  box-sizing: border-box;
  margin-top: 10px;
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  background: #111;
  color: white;
  cursor: pointer;
}

.product {
  margin-top: 15px;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 10px;
}

.delete {
  background: #d32f2f;
}
</style>
</head>

<body>

<div class="box">

<h1>🛍️ مدیریت Nova Store</h1>

<h2>ورود مدیر</h2>

<input id="email" type="email" placeholder="ایمیل">
<input id="password" type="password" placeholder="رمز عبور">

<button onclick="login()">ورود</button>

<div id="adminPanel" style="display:none;">

<h2>افزودن محصول</h2>

<input id="name" placeholder="نام محصول">
<input id="category" placeholder="دسته‌بندی">
<textarea id="description" placeholder="توضیحات محصول"></textarea>
<input id="price" type="number" placeholder="قیمت">
<input id="old_price" type="number" placeholder="قیمت قبلی">
<input id="image" placeholder="لینک عکس">
<input id="discount" placeholder="تخفیف، مثلا 20٪">
<label>
<input id="is_new" type="checkbox" style="width:auto;">
 محصول جدید
</label>

<button onclick="addProduct()">افزودن محصول</button>

<h2>محصولات</h2>

<div id="products"></div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://zwtbrgsphgjyczdibldj.supabase.co/rest/v1/";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_rU0rSsuonmSoDYzK9-S1ig_uNPkAOha";

const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

async function login() {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    alert("❌ ورود ناموفق بود: " + error.message);
    return;
  }

  document.getElementById("adminPanel").style.display = "block";
  loadProducts();
}

async function addProduct() {

  const product = {
    name: document.getElementById("name").value,
    category: document.getElementById("category").value,
    description: document.getElementById("description").value,
    price: document.getElementById("price").value,
    old_price: document.getElementById("old_price").value || null,
    image: document.getElementById("image").value,
    discount: document.getElementById("discount").value,
    is_new: document.getElementById("is_new").checked
  };

  const { error } = await supabase
    .from("products")
    .insert(product);

  if (error) {
    alert("❌ خطا: " + error.message);
    return;
  }

  alert("✅ محصول اضافه شد");
  loadProducts();
}

async function loadProducts() {

  const { data, error } = await supabase
    .from("products")
    .select("*")
    .order("id", { ascending: false });

  if (error) {
    alert("❌ خطا در دریافت محصولات: " + error.message);
    return;
  }

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(product => {

    container.innerHTML += `
      <div class="product">
        <strong>${product.name}</strong>
        <p>قیمت: ${product.price}</p>
        <p>${product.description || ""}</p>

        <button class="delete"
          onclick="deleteProduct(${product.id})">
          حذف محصول
        </button>
      </div>
    `;

  });
}

async function deleteProduct(id) {

  if (!confirm("حذف این محصول؟")) return;

  const { error } = await supabase
    .from("products")
    .delete()
    .eq("id", id);

  if (error) {
    alert("❌ خطا: " + error.message);
    return;
  }

  alert("✅ محصول حذف شد");
  loadProducts();
}

</script>

</body>
</html>
